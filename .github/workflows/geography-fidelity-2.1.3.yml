name: Build 2.1.3 Geography Fidelity

on:
  push:
    branches:
      - hotfix-2.1.3-geography-fidelity
    paths:
      - '.github/workflows/geography-fidelity-2.1.3.yml'
      - 'scripts/apply-geography-fidelity-2.1.3.py'

permissions:
  contents: write

jobs:
  build-geography:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Import regional vector geography and apply renderer fix
        run: python scripts/apply-geography-fidelity-2.1.3.py
      - name: Validate exact patched source
        run: |
          git diff --check
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run release
      - name: Commit validated geography fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/natural-earth-50m-countries.geojson \
            src/core/engine/EarthRenderer.ts \
            src/core/engine/GeographyRenderer.ts \
            src/features/globe/GlobeViewportBase.tsx \
            src/tests/geography-fidelity.test.ts \
            tests/e2e/performance.spec.ts
          git commit -m "fix: restore zoom-safe vector geography"
          git push origin HEAD:hotfix-2.1.3-geography-fidelity
