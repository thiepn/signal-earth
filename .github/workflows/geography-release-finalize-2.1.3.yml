name: Finalize Signal Earth 2.1.3 Geography Release

on:
  push:
    branches:
      - hotfix-2.1.3-geography-fidelity
    paths:
      - '.github/workflows/geography-release-finalize-2.1.3.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Prepare stable 2.1.3 release tree
        run: |
          set -euo pipefail
          npm version 2.1.3 --no-git-tag-version
          python scripts/finalize-geography-release-2.1.3.py
          git rm -f .github/workflows/geography-fidelity-2.1.3.yml
          git rm -f .github/workflows/geography-lod-2.1.3.yml
          git rm -f .github/workflows/geography-overview-perf-2.1.3.yml
          git rm -f .github/workflows/geography-release-finalize-2.1.3.yml
          git rm -f scripts/apply-geography-fidelity-2.1.3.py
          git rm -f scripts/finalize-geography-release-2.1.3.py
      - name: Certify cleaned stable release tree
        run: |
          git diff --check
          npm run release
      - name: Commit exact stable 2.1.3 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare Signal Earth 2.1.3 geography fidelity"
          git push origin HEAD:hotfix-2.1.3-geography-fidelity
