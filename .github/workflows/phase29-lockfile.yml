name: Phase 29 Lockfile Bootstrap

on:
  push:
    branches: [phase29-release-hardening]
    paths:
      - package.json
      - .github/workflows/phase29-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock Phase 29 dependencies"
          git push origin HEAD:phase29-release-hardening
