name: Integrate Signal Earth Phase 17

on:
  push:
    paths:
      - '.github/workflows/phase17-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply Living Earth integration
        run: |
          python scripts/phase17/part0.py
          python scripts/phase17/part1.py
          python scripts/phase17/part2.py
          python scripts/phase17/part3.py
          python scripts/phase17/part4.py
      - name: Certify integrated Phase 17
        run: |
          npm install --no-audit --no-fund
          npm run release
      - name: Commit Phase 17
        run: |
          git config user.name 'Signal Earth Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md package.json src docs
          git status --short
          git commit -m 'feat: implement Living Earth Phase 17'
          git push origin HEAD:phase17-living-earth
