name: Implement Signal Earth Phase 16

on:
  push:
    paths:
      - '.github/workflows/phase16-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Phase 16
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def write(path: str, content: str):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace(path: str, old: str, new: str, count: int = 1):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s) of anchor, found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)
              target.write_text(text, encoding='utf-8')

          write('src/features/now/geography.ts', '''import { greatCircleDistanceKm } from '../../shared/coordinates/geo';
import { SEARCH_CITIES } from '../search/cities';

export interface NearbyCityContext {
  city: string;
  country: string;
  distanceKm: number;
  label: string;
}

export function nearestCityContext(lat: number, lon: number, maxDistanceKm = 900): NearbyCityContext | null {
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  let best: NearbyCityContext | null = null;
  for (const city of SEARCH_CITIES) {
    const distanceKm = greatCircleDistanceKm({ lat, lon }, city.coordinates);
    if (distanceKm > maxDistanceKm || (best && distanceKm >= best.distanceKm)) continue;
    best = {
      city: city.name,
      country: city.country,
      distanceKm,
      label: `${Math.round(distanceKm).toLocaleString()} km from ${city.name}, ${city.country}`,
    };
  }
  return best;
}
''')

          write('src/features/now/ranking.ts', '''import type { LayerId } from '../../shared/types/layers';
import type { EntityId } from '../../shared/types/entities';
import type { SatelliteCategory } from '../../shared/types/orbit';
import type { EarthquakeRecord } from '../seismic/types';
import type { NaturalEventCategory, NaturalEventRecord } from '../natural-events/types';
import { NATURAL_EVENT_CATEGORY_LABELS } from '../natural-events/types';
import type { SatelliteRecord } from '../orbit/types';
import type { SpaceWeatherFeed } from '../space-weather/types';
import type { ObserverLocation, ObserverPassForecast } from '../above-me/types';
import { nearestCityContext } from './geography';

export type NowSignalKind = 'earthquake' | 'natural-event' | 'space-weather' | 'orbit' | 'local';
export type NowSignalTone = 'critical' | 'high' | 'medium' | 'info';
export type NowSignalAction = 'entity' | 'space-weather' | 'here';

export interface NowSignal {
  id: string;
  rank: number;
  kind: NowSignalKind;
  tone: NowSignalTone;
  score: number;
  eyebrow: string;
  title: string;
  summary: string;
  metric: string;
  source: string;
  timestamp: number | null;
  action: NowSignalAction;
  entityId?: EntityId;
  layer?: LayerId;
  coordinates?: { lat: number; lon: number };
  naturalEventCategory?: NaturalEventCategory;
  satelliteCategory?: SatelliteCategory;
}

export interface BuildNowSignalsInput {
  earthquakes: EarthquakeRecord[];
  naturalEvents: NaturalEventRecord[];
  spaceWeather: SpaceWeatherFeed | null;
  satellites: SatelliteRecord[];
  observerLocation: ObserverLocation | null;
  passForecast: ObserverPassForecast | null;
  now: number;
  limit?: number;
}

const HOUR = 3_600_000;

function ageHours(timestamp: number, now: number): number {
  return Math.max(0, (now - timestamp) / HOUR);
}

function recencyBonus(timestamp: number, now: number, maxBonus: number, horizonHours: number): number {
  const age = ageHours(timestamp, now);
  if (age >= horizonHours) return 0;
  return maxBonus * (1 - age / horizonHours);
}

function timePhrase(timestamp: number, now: number): string {
  const minutes = Math.max(0, Math.round((now - timestamp) / 60_000));
  if (minutes < 2) return 'just now';
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.round(hours / 24)}d ago`;
}

function earthquakeTone(magnitude: number): NowSignalTone {
  if (magnitude >= 7) return 'critical';
  if (magnitude >= 6) return 'high';
  if (magnitude >= 5) return 'medium';
  return 'info';
}

function eventTone(category: NaturalEventCategory): NowSignalTone {
  if (category === 'severe-storm') return 'high';
  return 'medium';
}

function currentEventFrame(event: NaturalEventRecord, now: number) {
  const eligible = event.geometry.filter((frame) => frame.timestamp <= now);
  return eligible[eligible.length - 1] ?? event.geometry[0] ?? null;
}

function rankEarthquakes(input: BuildNowSignalsInput): NowSignal[] {
  const candidates = input.earthquakes
    .filter((quake) => quake.time <= input.now + 5 * 60_000 && ageHours(quake.time, input.now) <= 48)
    .map((quake) => {
      const alertWeight = quake.alert === 'red' ? 16 : quake.alert === 'orange' ? 10 : quake.alert === 'yellow' ? 5 : 0;
      const score = quake.magnitude * 12 + Math.min(12, quake.significance / 85) + recencyBonus(quake.time, input.now, 16, 36) + alertWeight + (quake.tsunami ? 8 : 0);
      const nearby = nearestCityContext(quake.coordinates.lat, quake.coordinates.lon, 750);
      const context = nearby ? ` · ${nearby.label}` : '';
      return {
        id: `now:${quake.id}`,
        rank: 0,
        kind: 'earthquake' as const,
        tone: earthquakeTone(quake.magnitude),
        score,
        eyebrow: `EARTHQUAKE · ${timePhrase(quake.time, input.now)}`,
        title: `M${quake.magnitude.toFixed(1)} · ${quake.place}`,
        summary: `${quake.coordinates.depthKm.toFixed(0)} km deep${quake.felt ? ` · ${quake.felt.toLocaleString()} felt reports` : ''}${context}`,
        metric: `M${quake.magnitude.toFixed(1)}`,
        source: 'USGS',
        timestamp: quake.time,
        action: 'entity' as const,
        entityId: quake.id,
        layer: 'earthquakes' as const,
        coordinates: { lat: quake.coordinates.lat, lon: quake.coordinates.lon },
      };
    })
    .sort((a, b) => b.score - a.score);
  return candidates.slice(0, 2);
}

function rankNaturalEvents(input: BuildNowSignalsInput): NowSignal[] {
  const bases: Record<NaturalEventCategory, number> = { 'severe-storm': 61, volcano: 54, wildfire: 48 };
  const byCategory = new Map<NaturalEventCategory, NowSignal>();
  for (const event of input.naturalEvents) {
    if (event.startTime > input.now || (event.closedAt !== null && event.closedAt < input.now)) continue;
    const frame = currentEventFrame(event, input.now);
    if (!frame) continue;
    const score = bases[event.category] + Math.min(8, event.geometry.length * 0.35) + recencyBonus(event.updatedAt, input.now, 10, 72) + (frame.magnitudeValue ?? 0) * 0.25;
    const nearby = nearestCityContext(frame.point.lat, frame.point.lon, 900);
    const magnitude = frame.magnitudeValue === null ? '' : ` · ${frame.magnitudeValue}${frame.magnitudeUnit ? ` ${frame.magnitudeUnit}` : ''}`;
    const signal: NowSignal = {
      id: `now:${event.id}`,
      rank: 0,
      kind: 'natural-event',
      tone: eventTone(event.category),
      score,
      eyebrow: `${NATURAL_EVENT_CATEGORY_LABELS[event.category].toUpperCase()} · ACTIVE`,
      title: event.title,
      summary: `${event.geometry.length} observations${magnitude}${nearby ? ` · ${nearby.label}` : ''}`,
      metric: event.category === 'severe-storm' ? 'STORM' : event.category === 'volcano' ? 'VOLCANO' : 'FIRE',
      source: 'NASA EONET',
      timestamp: event.updatedAt,
      action: 'entity',
      entityId: event.id,
      layer: 'events',
      coordinates: { ...frame.point },
      naturalEventCategory: event.category,
    };
    const current = byCategory.get(event.category);
    if (!current || signal.score > current.score) byCategory.set(event.category, signal);
  }
  return [...byCategory.values()];
}

function rankSpaceWeather(input: BuildNowSignalsInput): NowSignal[] {
  const feed = input.spaceWeather;
  if (!feed) return [];
  const usableKp = feed.kp
    .filter((sample) => sample.timestamp <= input.now + 3 * HOUR && sample.kind !== 'predicted')
    .sort((a, b) => Math.abs(input.now - a.timestamp) - Math.abs(input.now - b.timestamp))[0]
    ?? feed.kp.slice().sort((a, b) => Math.abs(input.now - a.timestamp) - Math.abs(input.now - b.timestamp))[0]
    ?? null;
  const scales = feed.scales;
  const g = scales?.G.scale ?? 0;
  const r = scales?.R.scale ?? 0;
  const s = scales?.S.scale ?? 0;
  const maxScale = Math.max(g, r, s);
  const kp = usableKp?.kp ?? 0;
  const elevated = maxScale > 0 || kp >= 4;
  const title = g > 0 ? `G${g} geomagnetic storm conditions` : elevated ? 'Elevated geomagnetic activity' : 'Space weather is quiet';
  const score = (elevated ? 49 : 18) + maxScale * 12 + kp * 3;
  return [{
    id: 'now:space-weather',
    rank: 0,
    kind: 'space-weather',
    tone: maxScale >= 3 || kp >= 7 ? 'high' : elevated ? 'medium' : 'info',
    score,
    eyebrow: 'SPACE WEATHER · NOAA',
    title,
    summary: `Kp ${kp.toFixed(1)} · G${g} R${r} S${s}${feed.partial ? ' · partial feed' : ''}`,
    metric: `Kp ${kp.toFixed(1)}`,
    source: 'NOAA SWPC',
    timestamp: usableKp?.timestamp ?? feed.sourceUpdatedAt,
    action: 'space-weather',
    layer: 'aurora',
  }];
}

function rankOrbit(input: BuildNowSignalsInput): NowSignal[] {
  const iss = input.satellites.find((satellite) => satellite.noradId === '25544')
    ?? input.satellites.find((satellite) => /\bISS\b|INTERNATIONAL SPACE STATION/i.test(satellite.name));
  if (!iss) return [];
  const category = iss.categories.find((candidate) => candidate === 'stations') ?? iss.category;
  return [{
    id: `now:${iss.id}`,
    rank: 0,
    kind: 'orbit',
    tone: 'info',
    score: 39,
    eyebrow: 'ORBIT · LIVE PROPAGATION',
    title: 'International Space Station',
    summary: `Track ${iss.name} in real time and jump directly into its propagated orbit.`,
    metric: 'ISS',
    source: 'CelesTrak',
    timestamp: iss.epoch,
    action: 'entity',
    entityId: iss.id,
    layer: 'orbit',
    satelliteCategory: category,
  }];
}

function rankLocal(input: BuildNowSignalsInput): NowSignal[] {
  if (!input.observerLocation || !input.passForecast?.passes.length) return [];
  const pass = input.passForecast.passes.find((candidate) => candidate.endTime >= input.now);
  if (!pass) return [];
  const hoursUntil = (pass.startTime - input.now) / HOUR;
  if (hoursUntil > 24) return [];
  const nearby = nearestCityContext(input.observerLocation.lat, input.observerLocation.lon, 250);
  const when = hoursUntil <= 0 ? 'in progress' : hoursUntil < 1 ? `in ${Math.max(1, Math.round(hoursUntil * 60))} min` : `in ${hoursUntil.toFixed(1)}h`;
  return [{
    id: 'now:local-iss-pass',
    rank: 0,
    kind: 'local',
    tone: pass.maxElevationDeg >= 60 ? 'high' : pass.maxElevationDeg >= 35 ? 'medium' : 'info',
    score: 45 + Math.min(18, pass.maxElevationDeg / 5) + Math.max(0, 8 - Math.max(0, hoursUntil)),
    eyebrow: 'ABOVE ME · NEXT ISS PASS',
    title: `ISS pass ${when}`,
    summary: `Peak elevation ${pass.maxElevationDeg.toFixed(0)}°${nearby ? ` · observer near ${nearby.city}` : ''}`,
    metric: `${pass.maxElevationDeg.toFixed(0)}°`,
    source: 'Local + CelesTrak',
    timestamp: pass.startTime,
    action: 'here',
  }];
}

export function buildNowSignals(input: BuildNowSignalsInput): NowSignal[] {
  const limit = Math.max(1, Math.min(12, input.limit ?? 8));
  const ranked = [
    ...rankEarthquakes(input),
    ...rankNaturalEvents(input),
    ...rankSpaceWeather(input),
    ...rankLocal(input),
    ...rankOrbit(input),
  ].sort((a, b) => b.score - a.score || (b.timestamp ?? 0) - (a.timestamp ?? 0));

  return ranked.slice(0, limit).map((signal, index) => ({ ...signal, rank: index + 1 }));
}
''')

          write('src/features/now/NowPanel.tsx', '''import type { NowSignal, NowSignalKind } from './ranking';

interface NowPanelProps {
  signals: NowSignal[];
  loading?: boolean;
  compact?: boolean;
  onSelect(signal: NowSignal): void;
}

const GLYPHS: Record<NowSignalKind, string> = {
  earthquake: '◎',
  'natural-event': '△',
  'space-weather': '◌',
  orbit: '✦',
  local: '⌖',
};

function ageLabel(timestamp: number | null): string {
  if (!timestamp) return 'LIVE';
  const delta = timestamp - Date.now();
  const future = delta > 0;
  const minutes = Math.abs(Math.round(delta / 60_000));
  if (minutes < 2) return future ? 'SOON' : 'NOW';
  if (minutes < 60) return future ? `IN ${minutes}M` : `${minutes}M AGO`;
  const hours = Math.round(minutes / 60);
  if (hours < 48) return future ? `IN ${hours}H` : `${hours}H AGO`;
  return `${Math.round(hours / 24)}D AGO`;
}

export function NowPanel({ signals, loading = false, compact = false, onSelect }: NowPanelProps) {
  return <div className={`now-panel${compact ? ' now-panel--compact' : ''}`}>
    <div className="now-feed-intro">
      <div><span className="control-eyebrow">LIVE PRIORITY FEED</span><strong>What matters now</strong></div>
      <span className="now-feed-count">{signals.length || '—'}</span>
    </div>
    <p className="now-feed-note">Ranked locally from the public data already loaded by Signal Earth. No AI-generated event claims.</p>

    {signals.length > 0 ? <div className="now-signal-list">
      {signals.map((signal) => <button
        key={signal.id}
        type="button"
        className={`now-signal now-signal--${signal.tone}${signal.rank === 1 ? ' now-signal--featured' : ''}`}
        onClick={() => onSelect(signal)}
        aria-label={`Explore ${signal.title}`}
      >
        <span className="now-signal__rank">{String(signal.rank).padStart(2, '0')}</span>
        <span className="now-signal__body">
          <span className="now-signal__eyebrow"><b aria-hidden="true">{GLYPHS[signal.kind]}</b>{signal.eyebrow}</span>
          <strong>{signal.title}</strong>
          <small>{signal.summary}</small>
          <span className="now-signal__source">{signal.source} · {ageLabel(signal.timestamp)}</span>
        </span>
        <span className="now-signal__metric">{signal.metric}</span>
      </button>)}
    </div> : <div className="now-empty">
      <span aria-hidden="true">◌</span>
      <strong>{loading ? 'Gathering live signals…' : 'No priority signals available'}</strong>
      <p>{loading ? 'Signal Earth is loading the current Earth, orbit and space-weather feeds.' : 'Try again when a provider is available, or explore the globe directly.'}</p>
    </div>}
  </div>;
}
''')

          write('src/tests/now-ranking.test.ts', '''import { describe, expect, it } from 'vitest';
import { asEarthquakeId, type EarthquakeRecord } from '../features/seismic/types';
import { asNaturalEventId, type NaturalEventRecord } from '../features/natural-events/types';
import { asSatelliteId, type SatelliteRecord } from '../features/orbit/types';
import { buildNowSignals } from '../features/now/ranking';
import { nearestCityContext } from '../features/now/geography';

const NOW = Date.UTC(2026, 8, 14, 6, 0, 0);

function quake(magnitude: number, hoursAgo: number): EarthquakeRecord {
  return {
    id: asEarthquakeId(`q-${magnitude}`), usgsId: `q-${magnitude}`, place: 'Test Region', magnitude, magnitudeType: 'mw',
    time: NOW - hoursAgo * 3_600_000, updated: NOW, coordinates: { lat: 35.7, lon: 139.7, depthKm: 24 },
    url: 'https://example.com', detailUrl: 'https://example.com/detail', felt: 120, cdi: 4, mmi: 5,
    alert: null, status: 'reviewed', tsunami: false, significance: 650, network: 'us', code: 'test',
  };
}

function event(category: NaturalEventRecord['category']): NaturalEventRecord {
  return {
    id: asNaturalEventId(`event-${category}`), eonetId: `event-${category}`, title: `Test ${category}`,
    description: null, category, categoryTitle: category, link: 'https://example.com', sources: [],
    startTime: NOW - 24 * 3_600_000, closedAt: null, updatedAt: NOW - 3_600_000,
    geometry: [{ timestamp: NOW - 3_600_000, type: 'point', point: { lat: 34, lon: -118 }, magnitudeValue: null, magnitudeUnit: null, magnitudeDescription: null }],
  };
}

function iss(): SatelliteRecord {
  return {
    id: asSatelliteId('25544'), name: 'ISS (ZARYA)', noradId: '25544', category: 'stations', categories: ['stations'],
    epoch: NOW, omm: {} as SatelliteRecord['omm'],
  } as SatelliteRecord;
}

describe('Signal Earth Now ranking', () => {
  it('puts a major recent earthquake ahead of routine orbital context', () => {
    const signals = buildNowSignals({ earthquakes: [quake(7.2, 1)], naturalEvents: [], spaceWeather: null, satellites: [iss()], observerLocation: null, passForecast: null, now: NOW });
    expect(signals[0]?.kind).toBe('earthquake');
    expect(signals[0]?.metric).toBe('M7.2');
    expect(signals.some((signal) => signal.kind === 'orbit')).toBe(true);
  });

  it('keeps only the strongest current item from each natural-event category', () => {
    const first = event('wildfire');
    const second = { ...event('wildfire'), id: asNaturalEventId('event-wildfire-2'), eonetId: 'event-wildfire-2', geometry: [...first.geometry, ...first.geometry] };
    const signals = buildNowSignals({ earthquakes: [], naturalEvents: [first, second, event('volcano')], spaceWeather: null, satellites: [], observerLocation: null, passForecast: null, now: NOW });
    expect(signals.filter((signal) => signal.kind === 'natural-event' && signal.naturalEventCategory === 'wildfire')).toHaveLength(1);
    expect(signals.filter((signal) => signal.kind === 'natural-event' && signal.naturalEventCategory === 'volcano')).toHaveLength(1);
  });

  it('adds local ISS passes as a first-class discovery signal', () => {
    const passForecast = { generatedAt: NOW, startTime: NOW, horizonHours: 24, satelliteId: asSatelliteId('25544'), passes: [{ satelliteId: asSatelliteId('25544'), startTime: NOW + 30 * 60_000, endTime: NOW + 37 * 60_000, maxTime: NOW + 34 * 60_000, maxElevationDeg: 72, riseAzimuthDeg: 250, maxAzimuthDeg: 180, setAzimuthDeg: 90 }] };
    const observerLocation = { lat: 50.9375, lon: 6.9603, altitudeKm: 0, accuracyM: 20, acquiredAt: NOW, source: 'browser' as const };
    const signals = buildNowSignals({ earthquakes: [], naturalEvents: [], spaceWeather: null, satellites: [], observerLocation, passForecast, now: NOW });
    expect(signals[0]?.kind).toBe('local');
    expect(signals[0]?.title).toContain('ISS pass');
  });
});

describe('Phase 16 geographic context', () => {
  it('recognizes coordinates close to Cologne', () => {
    const nearby = nearestCityContext(50.94, 6.96, 100);
    expect(nearby?.city).toBe('Cologne');
    expect(nearby?.distanceKm).toBeLessThan(5);
  });
});
''')

