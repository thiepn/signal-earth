name: Implement Signal Earth Phase 16

on:
  push:
    paths:
      - '.github/workflows/phase16-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply staged Phase 16 patch
        run: python scripts/recover_phase16.py

      - name: Commit Phase 16
        run: |
          git config user.name 'Signal Earth Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md package.json src docs
          git status --short
          git commit -m 'feat: implement Signal Earth Now Phase 16'
          git push origin HEAD:main

# trigger: history scan ready
