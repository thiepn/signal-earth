name: Bootstrap Signal Earth V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_URL: 'https://uc481c2a2d5ce9c9dc2bde10e7f0.dl.dropboxusercontent.com/cd/0/get/DIE7h5lzJPlLCttYkR_qwAJohbZbH-3lNaPGWcHes85gfWpFtiTbV0YsDunhgjF6Wf_oCZJiBO5W7zhbo0ASQbU87KIvUzf3bCAwltZ2TdunAYNH1EY92r1J5fKga3rnqA8qjdufrGRBd-66b4bpsgLzK-4a8ZP8-2nfx10CHOou0A/file?c_luid=39011dda'
      SOURCE_SHA256: '4ee646c29d051554b4cdca6c146c9bcaf19d8d44df40dc5523820b9c9eb7bbca'
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download authoritative V1 archive
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_URL"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" \
            --output /tmp/signal-earth-v1.zip
          printf '%s  %s\n' "$SOURCE_SHA256" /tmp/signal-earth-v1.zip | sha256sum --check --strict
          echo "Archive checksum verified."

      - name: Extract and locate Signal Earth project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/signal-earth-v1
          mkdir -p /tmp/signal-earth-v1
          unzip -q /tmp/signal-earth-v1.zip -d /tmp/signal-earth-v1

          PROJECT_ROOT="$(find /tmp/signal-earth-v1 -type f -name package.json -print0 \
            | while IFS= read -r -d '' package; do
                root="$(dirname "$package")"
                if [[ -f "$root/src/main.tsx" && -f "$root/README.md" ]]; then
                  printf '%s\n' "$root"
                fi
              done \
            | head -n 1)"

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "Could not locate Signal Earth project root." >&2
            exit 1
          fi

          printf '%s' "$PROJECT_ROOT" > /tmp/signal-earth-project-root
          echo "Project root: $PROJECT_ROOT"
          echo "Project files: $(find "$PROJECT_ROOT" -type f | wc -l)"

      - name: Validate V1 source contract
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat /tmp/signal-earth-project-root)"
          test -f "$PROJECT_ROOT/package.json"
          test -f "$PROJECT_ROOT/src/main.tsx"
          test -f "$PROJECT_ROOT/vite.config.ts"
          test -f "$PROJECT_ROOT/tsconfig.json"
          test -f "$PROJECT_ROOT/.github/workflows/test.yml"
          test -f "$PROJECT_ROOT/.github/workflows/deploy.yml"
          test -f "$PROJECT_ROOT/scripts/release-verify.mjs"
          test -f "$PROJECT_ROOT/public/manifest.webmanifest"
          test -f "$PROJECT_ROOT/public/earth/earth-day-2k.webp"
          test -f "$PROJECT_ROOT/public/data/natural-earth-lowres.geojson"
          test -d "$PROJECT_ROOT/docs"
          grep -q '"name": "signal-earth"' "$PROJECT_ROOT/package.json"
          grep -q '"version": "1.0.0"' "$PROJECT_ROOT/package.json"
          echo "Signal Earth V1 source contract validated."

      - name: Replace bootstrap repository with V1 source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat /tmp/signal-earth-project-root)"

          # The Actions token has contents:write but cannot modify workflow files.
          # Preserve this importer byte-for-byte and install the final release workflows
          # through the connected GitHub account after the source cutover lands.
          cp .github/workflows/bootstrap-v1.yml /tmp/bootstrap-v1.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$PROJECT_ROOT"/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/bootstrap-v1.yml .github/workflows/bootstrap-v1.yml

          echo "Materialized $(find . -type f ! -path './.git/*' | wc -l) source files."
          git status --short

      - name: Commit V1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet -- .github/workflows; then
            echo "Unexpected workflow-file diff; refusing source-only push." >&2
            git diff --cached -- .github/workflows
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "release: materialize Signal Earth v1.0.0 source"
          git push origin HEAD:main
