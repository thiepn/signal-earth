name: Tune 2.1.3 Overview Geography Performance

on:
  push:
    branches:
      - hotfix-2.1.3-geography-fidelity
    paths:
      - '.github/workflows/geography-overview-perf-2.1.3.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore lightweight overview mesh
        run: |
          python - <<'PY'
          from pathlib import Path

          earth = Path('src/core/engine/EarthRenderer.ts')
          text = earth.read_text()
          text = text.replace("import { GLOBE_CURVATURE_DEGREES } from './geographyFidelity';\n", '')
          old = """    // Sphere shape is geographic fidelity, not an effects budget. Keeping
              // this constant prevents reduced-quality mode from turning close views
              // into visibly faceted 10-degree globe patches.
              this.#context.globe
                .globeCurvatureResolution(GLOBE_CURVATURE_DEGREES)
          """
          new = """    // The textured sphere is the lightweight overview surface. Regional/local
              // zoom switches to GeographyRenderer's separate smooth ocean + 1:50m
              // vector land surface, so overview tessellation can remain performance-scaled.
              const curvature = profile.effects === 'reduced' ? 10 : profile.effects === 'normal' ? 6 : 4;
              this.#context.globe
                .globeCurvatureResolution(curvature)
          """
          if old not in text:
              raise SystemExit('EarthRenderer overview-curvature patch target not found')
          earth.write_text(text.replace(old, new, 1))

          fidelity = Path('src/core/engine/geographyFidelity.ts')
          text = fidelity.read_text()
          text = text.replace("export const GLOBE_CURVATURE_DEGREES = 2;\n", '')
          text = text.replace("// The base sphere stays smooth regardless of the effects tier. Country and\n// coastline shape comes from the untouched 1:50m source vertices; the polygon\n// cap curvature only controls interior sphere tessellation, not boundary detail.\n", "// Regional coastline shape comes from untouched 1:50m source vertices. The\n// polygon cap curvature controls only interior spherical fill tessellation.\n")
          fidelity.write_text(text)

          test = Path('src/tests/geography-fidelity.test.ts')
          text = test.read_text()
          text = text.replace("  GLOBE_CURVATURE_DEGREES,\n", '')
          old = """  it('keeps the base globe smooth while leaving polygon fill tessellation bounded', () => {
              expect(GLOBE_CURVATURE_DEGREES).toBeLessThanOrEqual(2);
              expect(LAND_CURVATURE_DEGREES).toBeLessThanOrEqual(5);
            });
          """
          new = """  it('keeps regional polygon fill tessellation bounded without simplifying coastline vertices', () => {
              expect(LAND_CURVATURE_DEGREES).toBeLessThanOrEqual(5);
            });
          """
          if old not in text:
              raise SystemExit('geography fidelity test patch target not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Validate release source
        run: |
          git diff --check
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run release
      - name: Run focused Chromium geography/performance gates
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/performance.spec.ts --project=chromium-desktop --retries=0
      - name: Commit validated overview tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/engine/EarthRenderer.ts src/core/engine/geographyFidelity.ts src/tests/geography-fidelity.test.ts
          git commit -m "perf: keep overview mesh lightweight under regional geography LOD"
          git push origin HEAD:hotfix-2.1.3-geography-fidelity
