name: Cross-browser QA

on:
  push:
    branches:
      - main
      - 'phase26-*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interaction-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run qa:e2e:run
      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase26-playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
