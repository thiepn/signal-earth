name: Validate 2.1.3 Regional Geography LOD

on:
  push:
    branches:
      - hotfix-2.1.3-geography-fidelity
    paths:
      - '.github/workflows/geography-lod-2.1.3.yml'

permissions:
  contents: read

jobs:
  chromium-regional-lod:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Single-project gate used while tuning local geography; full matrix follows.
      - name: Run resolution, cadence and Istanbul geography gates
        run: npx playwright test tests/e2e/performance.spec.ts --project=chromium-desktop --retries=0
